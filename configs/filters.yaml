# Parametry metod filtracji.
#
# Ten plik jest jedynym miejscem, w ktorym parametry sa dobierane, a `git log` na nim jest
# historia strojenia. Wartosci rozstrzygniete dla konkretnego wywolania trafiaja do
# `FilterResult.params`, wiec wynik sprzed miesiaca daje sie odtworzyc nawet po zmianie
# tego pliku.
#
# Stroic wylacznie na materiale development. Parametr dobrany pod pacjentow testowych
# zamienia ich w zbior uczacy i uniewaznia caly wynik.
#
# Caly material pracy jest probkowany 360 Hz: MIT-BIH z definicji, a neurobit ustawiony
# na te sama wartosc, zeby porownanie bylo bezposrednie.
#
# Okna czasowe podane sa mimo to w milisekundach. Dlugosc 25 ms mowi, co filtr robi -
# wygladza polowe zespolu QRS - podczas gdy dlugosc dziewieciu probek mowi tylko, jak
# zostal zaimplementowany. Przy ewentualnej zmianie czestotliwosci zaden parametr nie
# wymaga korekty.

static:

  # Pasmo 0.5-40 Hz obejmuje zespol QRS (5-20 Hz) oraz zalamki P i T (0.5-10 Hz),
  # a odcina wedrowanie linii izoelektrycznej i zaklocenie sieciowe.
  #
  # Dlugosc filtru wynika z pasma przejsciowego, nie z wygody: df = 3.3 * fs / N dla okna
  # Hamminga. Przy 101 wspolczynnikach df wynosi 11.8 Hz i dolna granica 0.5 Hz jest
  # nieosiagalna - filtr przepuszcza wedrowanie linii, ktore mial odciac. Zmierzone
  # residuum wzgledem sygnalu czystego: 101 wsp. -> 0.211, 601 -> 0.052, 901 -> 0.047,
  # IIR rzedu 4 -> 0.045. 1700 ms daje 613 wspolczynnikow przy 360 Hz, czyli df = 1.94 Hz.
  #
  # Filtracja zerofazowa wymaga ponad 3*N probek, wiec ta dlugosc zaklada okno 4096.
  fir_bandpass:
    low_hz: 0.5
    high_hz: 40.0
    numtaps_ms: 1700.0
    window: hamming
    zero_phase: true

  iir_bandpass:
    order: 4
    low_hz: 0.5
    high_hz: 40.0
    ftype: butter
    zero_phase: true

  # 25 ms to okolo polowa czasu trwania zespolu QRS; dluzsze okno zaczyna go splaszczac.
  moving_average:
    window_ms: 25.0

  # Mediana znosi zaklocenia impulsowe bez rozmycia zbocza, wiec moze byc dluzsza.
  moving_median:
    window_ms: 60.0

  wavelet_denoising:
    wavelet: db4
    level: 5
    mode: soft

  # Poziom 9 jest gorna granica zadania; faktyczny wynika z dlugosci okna i jest
  # raportowany. Przy oknie 4096 i 360 Hz wychodzi poziom 8, czyli ciecie ponizej 0.70 Hz.
  # max_cut_hz zabezpiecza przed uruchomieniem tej metody na oknie zbyt krotkim, gdzie
  # ciecie wpadloby w zalamki P i T.
  wavelet_baseline:
    wavelet: db8
    level: 9
    max_cut_hz: 1.0

  emd_denoising:
    max_imf: 6
    noise_components: 3

adaptive:

  # Referencja jest standaryzowana do wariancji jednostkowej przed kazda z tych metod.
  # Granica stabilnosci LMS to 0 < mu < 2/(M*Px), wiec mu dobrane dla akcelerometru
  # podanego w jednostkach g rozbiega sie dla tego samego czujnika w zliczeniach ADC.
  # Po ustaleniu mocy referencji mu jest wlasnoscia algorytmu, nie toru pomiarowego.
  #
  # svm: true zwija kazdy akcelerometr do modulu przyspieszenia, czyli 3 kanaly na 1.
  # Sluzy do porownania "trzy osie kontra modul", nie jest wartoscia domyslna.

  lms_anc:
    mu: 0.001
    filter_order: 5
    lowpass_hz: 40.0          # sygnal prowadzacy dla adaptacji wag
    lowpass_order: 4
    standardise_reference: true
    svm: false

  rls_anc:
    filter_order: 5
    lam: 0.99                 # wspolczynnik zapominania
    delta: 1.0                # inicjalizacja macierzy P; zbyt male przy referencji
                              # blisko osobliwej prowadzi do rozbieznosci numerycznej
    standardise_reference: true
    svm: false

  blms_anc:
    L: 10                     # dlugosc bloku
    mu: 0.01
    filter_order: 32
    standardise_reference: true
    svm: false

  # Krata Laguerrea przyjmuje jeden kanal odniesienia z konstrukcji.
  #
  # reduction = pca rzutuje kanaly na pierwsza skladowa glowna. Modul przyspieszenia
  # (svm) wygladal na wybor bardziej naturalny, ale rektyfikacja niszczy zaleznosc
  # liniowa, na ktorej dziala kompensator: zmierzona korelacja modulu z kanalem
  # generujacym artefakt wyniosla 0.015 wobec 0.80 dla PC1, a filtr na module poprawil
  # SNR o 0.04 dB wobec 8.5 dB dla PC1. Wartosc svm zostaje wylacznie do pokazania
  # tego porownania w pracy.
  gall_anc:
    M: 5
    beta: 1.0                 # wspolczynnik zapominania
    alpha: 0.0                # alpha = 0 daje zwykla krate gradientowa
    epsi: 0.001
    reduction: pca
    standardise_reference: true

  gall_kalman:
    M_gall: 5
    beta_gall: 1.0
    alpha_gall: 0.0
    epsi_gall: 0.001
    lambda_K: 0.99
    delta_K: 1.0
    standardise_reference: true
    svm: false

deep: {}
